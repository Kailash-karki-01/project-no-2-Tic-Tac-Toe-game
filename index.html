<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
<h1> Tic Tac Toe</h1>
<div class="options">
  <h2>Mode (two player)
  </h2>
  <div class="modes">
 <a href="computer.html"  target=""> <p1> <i>Vs</i> computer</p1></a> 
 <a href="index.html"> <p2>Two player</p2>  </a> 
  </div>
</div>
<div class="main-display">
    <div class="container">
      <button type="button" id="box1" class="move"></button>
      <button type="button" id="box2" class="move"></button>
      <button type="button" id="box3" class="move"></button>
      <button type="button" id="box4" class="move"></button>
      <button type="button" id="box5" class="move"></button>
      <button type="button" id="box6" class="move"></button>
      <button type="button" id="box7" class="move"></button>
      <button type="button" id="box8" class="move"></button>
      <button type="button" id="box9" class="move"></button>
      
    </div>
<div class="score-board">
  <table>
    <tr>
    <th colspan="2">
      SCORE
    </th>
</tr>
<tr>
    <td>Player X</td>
    <td>Player O</td>
    </tr>
<tr>
    <td id="count1">0</td>
    <td id="count2">0</td>
    </tr>
  </table>

<span class="icons">
  <button type="button" id = "scoreclr">Clear score</button>
</span>
<span class="icons">
  <button type="button" id="reset">Reset</button>
</span>
</div>
</div>
<!-- <div class="winning-message">

  <h2 id="winner">winner </h2>
</div> -->
<dialog id="winning-message"> <h2 id="win">Winner</h2></dialog>
    <script src="script.js"></script>
  </body>
</html>
